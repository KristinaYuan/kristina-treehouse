name: Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3

  # Deployment is handled by Cloudflare Pages direct integration.
  # Connect your GitHub repo in Cloudflare Dashboard:
  #   Build command: npm run build
  #   Build output: dist
